# Breadboard-style wiring (Fritzing-like). Render: python docs/architecture/breadboard/render.py
#   - Boards at ~real size (6 px = 1 mm), headers in the real pin order (component side up).
#   - Pin names with "#n" are repeated names on one board (shown without the suffix).
#   - Wire "via" points: {x: ..} moves horizontally, {y: ..} vertically. Rails accept a wire at any height.
#   - MCU pins must match Arduino/app/src/board_config.h

title: Automatic Telescope - Breadboard wiring (draft)
canvas: {w: 1150, h: 1010}
stub: 40
memo_at: 24

notes:
  x: 640
  y: 905
  lines:
    - "• 노란 메모 = 모듈 쪽 핀 역할. 선은 이름 기준으로 연결 (핀 순서가 다른 모듈이어도 그대로 적용)."
    - "• L298N ENA 점퍼를 빼고 D8(PWM)에 연결. 배터리(-)와 MCU GND는 반드시 공통."
    - "• D3·D4는 부팅 시 HIGH, D8은 LOW여야 부팅됨. USB 업로드 시 GPS TX(→RX) 선을 분리."
    - "• (assumed) = 코드로 확인 안 된 부품.  ⚠ = 핀 순서 실물 확인 필요."

rails:
  - id: RAIL
    title: 3V3 / GND / I2C 버스 (브레드보드 레일)
    x: 700
    y: 30
    h: 860
    spacing: 18
    lines:
      - {name: 3V3, color: "#d62728"}
      - {name: GND, color: "#222222"}
      - {name: SCL, color: "#e6c200"}
      - {name: SDA, color: "#1e9e3a"}

parts:
  - id: MCU
    title: NodeMCU v3
    subtitle: ESP8266 (LoLin)
    x: 380
    y: 170
    w: 186
    h: 348
    color: "#1b1b1b"
    stub: 14
    no_memo: true
    title_y: 190
    decor:
      - {kind: rect, x: 38, y: 8, w: 110, h: 100, fill: "#bdbdbd", stroke: "#888"}
      - {kind: text, x: 93, y: 62, text: "ESP-12F", size: 11}
      - {kind: rect, x: 70, y: 326, w: 46, h: 22, fill: "#9e9e9e", stroke: "#666"}
      - {kind: text, x: 93, y: 320, text: "USB", size: 9}
    headers:
      - side: left
        pins: [A0, RSV, "RSV#2", SD3, SD2, SD1, CMD, SD0, CLK, "GND#3", "3V3#3", EN, RST, "GND#4", VIN]
      - side: right
        pins: [D0, D1, D2, D3, D4, 3V3, GND, D5, D6, D7, D8, RX, TX, "GND#2", "3V3#2"]

  - id: OLED
    title: SSD1306 OLED
    subtitle: 0.96" 128x64 I2C 0x3C
    x: 880
    y: 110
    w: 162
    h: 162
    color: "#20304a"
    title_y: 86
    decor:
      - {kind: rect, x: 10, y: 38, w: 142, h: 96, fill: "#06101f", stroke: "#3a5070"}
    headers:
      - {side: top, pins: [GND, VCC, SCL, SDA]}

  - id: IMU
    title: ICM20948
    subtitle: Adafruit 9-DoF
    warn: "⚠ 핀 순서 실물 확인"
    x: 880
    y: 320
    w: 152
    h: 130
    color: "#33236b"
    title_y: 58
    decor:
      - {kind: rect, x: 80, y: 50, w: 22, h: 22, fill: "#111", stroke: "#555"}
    headers:
      - {side: left, pins: [VIN, 1V8, GND, SCL, SDA, SDO, CS, INT]}

  - id: GPS
    title: Ultimate GPS v3
    subtitle: Adafruit, 115200 bps
    warn: "⚠ 핀 순서 실물 확인"
    x: 880
    y: 490
    w: 210
    h: 153
    color: "#1d1d1d"
    title_y: 124
    decor:
      - {kind: rect, x: 95, y: 18, w: 88, h: 88, rx: 4, fill: "#c9b38a", stroke: "#8a7550"}
      - {kind: circle, x: 139, y: 62, r: 9, fill: "#b8b8b8", stroke: "#777"}
    headers:
      - {side: left, pins: [3.3V, EN, VBAT, FIX, TX, RX, GND, VIN, PPS]}

  - id: ENC
    title: Rotary encoder
    subtitle: (assumed KY-040)
    x: 880
    y: 690
    w: 192
    h: 114
    color: "#1f4f9c"
    title_y: 100
    decor:
      - {kind: circle, x: 120, y: 50, r: 30, fill: "#cfcfcf", stroke: "#888"}
      - {kind: circle, x: 120, y: 50, r: 11, fill: "#8d8d8d", stroke: "#555"}
    headers:
      - {side: left, pins: [CLK, DT, SW, "+", GND]}

  - id: DRV
    title: L298N motor driver
    subtitle: (assumed)
    x: 330
    y: 610
    w: 258
    h: 258
    color: "#b3261e"
    title_y: 150
    decor:
      - {kind: rect, x: 70, y: 175, w: 118, h: 70, fill: "#2a2a2a", stroke: "#000"}
      - {kind: text, x: 129, y: 215, text: "heatsink", size: 9}
    headers:
      - {side: top, pins: [12V, GND, 5V], pitch: 30, start: 30}
      - {side: top, pins: [ENA, IN1, IN2, IN3, IN4, ENB], start: 130}
      - {side: left, pins: [OUT1, OUT2], pitch: 30, start: 100}
      - {side: right, pins: [OUT3, OUT4], pitch: 30, start: 100}

  - id: MOT
    title: RA motor
    subtitle: DC geared 300:1
    x: 150
    y: 685
    w: 120
    h: 80
    color: "#5a5a5a"
    title_y: 36
    headers:
      - {side: right, pins: [M+, M-], pitch: 30, start: 25}

  - id: BUCK
    title: DC-DC buck 12V→5V
    subtitle: (assumed LM2596)
    x: 60
    y: 380
    w: 258
    h: 126
    color: "#1f4f9c"
    title_y: 60
    decor:
      - {kind: circle, x: 200, y: 40, r: 16, fill: "#2b2b2b", stroke: "#000"}
    headers:
      - {side: left, pins: [IN+, IN-], pitch: 30}
      - {side: right, pins: [OUT+, OUT-], pitch: 30}

  - id: BAT
    title: Battery pack
    subtitle: 3S Li-ion 12.6 V (assumed)
    x: 40
    y: 880
    w: 220
    h: 80
    color: "#2f6f3a"
    title_y: 44
    headers:
      - {side: top, pins: ["+", "-"], pitch: 30, start: 30}

wires:
  # ---- Power : battery -> buck -> NodeMCU VIN
  - {from: BAT.+, to: BUCK.IN+, color: "#d62728", stub: 20, via: [{x: 22}], memo: "+12V"}
  - {from: BAT.-, to: BUCK.IN-, color: "#222222", stub: 10, via: [{x: 34}], memo: GND}
  - {from: BUCK.OUT+, to: MCU.VIN, color: "#d62728", stub: 22, via: [{x: 350}], memo: "+5V", memo_at: 11}
  - {from: BUCK.OUT-, to: "MCU.GND#4", color: "#222222", stub: 34, via: [{x: 362}], memo: GND, memo_at: 16}

  # ---- Power : battery -> L298N motor supply
  - {from: BAT.+, to: DRV.12V, color: "#d62728", stub: 34, via: [{x: 300}, {y: 585}], stub2: 34, memo: null, memo2: "+12V"}
  - {from: BAT.-, to: DRV.GND, color: "#222222", stub: 26, via: [{x: 312}, {y: 595}], stub2: 24, memo: null, memo2: GND}

  # ---- 3V3 / GND / I2C from NodeMCU to the rail
  - {from: MCU.3V3, to: RAIL.3V3, color: "#d62728"}
  - {from: MCU.GND, to: RAIL.GND, color: "#222222"}
  - {from: MCU.D1, to: RAIL.SCL, color: "#e6c200"}
  - {from: MCU.D2, to: RAIL.SDA, color: "#1e9e3a"}

  # ---- OLED (header on top) : up, then left to the rail
  - {from: OLED.GND, to: RAIL.GND, color: "#222222", stub: 40}
  - {from: OLED.VCC, to: RAIL.3V3, color: "#d62728", stub: 50}
  - {from: OLED.SCL, to: RAIL.SCL, color: "#e6c200", stub: 60}
  - {from: OLED.SDA, to: RAIL.SDA, color: "#1e9e3a", stub: 70}

  # ---- IMU
  - {from: IMU.VIN, to: RAIL.3V3, color: "#d62728"}
  - {from: IMU.GND, to: RAIL.GND, color: "#222222"}
  - {from: IMU.SCL, to: RAIL.SCL, color: "#e6c200"}
  - {from: IMU.SDA, to: RAIL.SDA, color: "#1e9e3a"}

  # ---- GPS (UART0, crossed TX/RX)
  - {from: GPS.VIN, to: RAIL.3V3, color: "#d62728"}
  - {from: GPS.GND, to: RAIL.GND, color: "#222222"}
  - {from: GPS.TX, to: MCU.RX, color: "#1f77b4", via: [{x: 681}], memo: "TX→", memo2: RX}
  - {from: GPS.RX, to: MCU.TX, color: "#8e44ad", via: [{x: 669}], memo: "RX←", memo2: TX}

  # ---- Rotary encoder
  - {from: ENC.+, to: RAIL.3V3, color: "#d62728", memo: "VCC"}
  - {from: ENC.GND, to: RAIL.GND, color: "#222222"}
  - {from: ENC.CLK, to: MCU.D6, color: "#ff7f0e", via: [{x: 657}], memo: "CLK(S1)", memo2: D6}
  - {from: ENC.DT, to: MCU.D7, color: "#17becf", via: [{x: 645}], memo: "DT(S2)", memo2: D7}
  - {from: ENC.SW, to: MCU.D4, color: "#bcbd22", via: [{x: 633}], memo: "SW(KEY)", memo2: D4}

  # ---- L298N control (header on top) : up, right, up to NodeMCU
  - {from: DRV.ENA, to: MCU.D8, color: "#f5f5f5", stub: 30, via: [{y: 540}, {x: 585}], memo: "ENA(PWM)", memo_at: 14, memo2: D8}
  - {from: DRV.IN1, to: MCU.D0, color: "#9e9e9e", stub: 45, via: [{y: 555}, {x: 597}], memo: IN1, memo_at: 22, memo2: D0}
  - {from: DRV.IN2, to: MCU.D3, color: "#795548", stub: 30, via: [{y: 570}, {x: 609}], memo: IN2, memo_at: 14, memo2: D3}

  # ---- Motor
  - {from: DRV.OUT1, to: MOT.M+, color: "#d62728", memo: OUT1, memo2: "M+"}
  - {from: DRV.OUT2, to: MOT.M-, color: "#222222", memo: OUT2, memo2: "M-"}
